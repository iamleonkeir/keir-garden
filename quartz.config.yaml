# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: keir.be
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: en-GB
  baseUrl: keir.be
  ignorePatterns:
    - private
    - templates
    - Templates # the garden vault's Obsidian templates (matching is case-sensitive)
    - Templates/** # …and its files, for the preview's watcher (it matches file by file)
    - private/**
    - .obsidian
  theme:
    # keir.be design (modelled on Mintlify "Sequoia"). Fonts are self-hosted:
    # files in quartz/static/fonts, @font-face in quartz/styles/keirbe/_fonts.scss
    fontOrigin: local
    cdnCaching: true
    typography:
      title: Inter
      header: Inter
      body: Inter
      code: Geist Mono
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#f1f2ee"
        gray: "#737470"
        darkgray: "#42423e"
        dark: "#1a1b16"
        secondary: "#6a7502"
        tertiary: "#808e02"
        highlight: rgba(128, 142, 2, 0.08)
        textHighlight: rgba(178, 198, 0, 0.35)
      darkMode:
        light: "#0c0d0b"
        lightgray: "#292925"
        gray: "#737470"
        darkgray: "#a2a29e"
        dark: "#e2e2de"
        secondary: "#b2c600"
        tertiary: "#808e02"
        highlight: rgba(178, 198, 0, 0.1)
        textHighlight: rgba(178, 198, 0, 0.25)
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: minimal
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false # replaced by the keir.be frame's own menu (quartz/components/keirbe/Nav.tsx)
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    options:
      # the hidden growth/<stage> tags (added in quartz.ts) stay out of the graph
      localGraph:
        removeTags: [growth/acorn, growth/seedling, growth/sapling, growth/oak, growth/houseplant, growth/evergreen]
      globalGraph:
        removeTags: [growth/acorn, growth/seedling, growth/sapling, growth/oak, growth/houseplant, growth/evergreen]
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header # keir.be frame: 1st header component = centre of the top bar
      priority: 20
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false # keir.be frame draws the brand itself (keir.be + "nson")
    layout:
      position: header
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header # keir.be frame: further header components = right, before Sign-in
      priority: 30
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: header
      priority: 35
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false # the keir.be frame draws its own footer (Footer.tsx), crediting Quartz and Obsidian
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: false # was the mobile spacer for the left-column toolbar, now in the header
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: keirbe # keir.be frame (two-tone header), registered in quartz.ts
      exclude:
        # exclude takes the plugin's full source, as listed under plugins above
        - "@quartz-community/table-of-contents" # the keir.be frame draws "On this page" itself (Toc.tsx)
    folder:
      template: keirbe
      exclude:
        - "@quartz-community/reader-mode"
      positions:
        right: []
    tag:
      template: keirbe
      exclude:
        - "@quartz-community/reader-mode"
      positions:
        right: []
    canvas: {}
    bases:
      template: keirbe
      exclude:
        - "@quartz-community/table-of-contents"
